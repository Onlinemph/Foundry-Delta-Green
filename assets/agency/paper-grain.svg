<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Original artwork for the GURPS Agency fork dossier theme: seamless paper fibre/grain tile, tinted by the background colour behind it. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75 0.62" numOctaves="3" seed="23" stitchTiles="stitch" result="fine"/>
    <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.30  0.7 0 0 0 -0.31" result="speck"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="5" stitchTiles="stitch" result="fibre"/>
    <feColorMatrix in="fibre" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.30  0.32 0 0 0 -0.14" result="streak"/>
    <feMerge><feMergeNode in="streak"/><feMergeNode in="speck"/></feMerge>
  </filter>
  <rect width="240" height="240" filter="url(#grain)"/>
</svg>
